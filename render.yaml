# Blueprint do Render (render.com > New > Blueprint). Dois serviços grátis:
# - rota404-api: Flask (dorme após 15 min sem acesso; acorda em ~1 min)
# - rota404: site estático do Next (CDN, não dorme)
# Valores com sync: false são pedidos na criação; veja "Publicar no Render" no README.
services:
  - type: web
    name: rota404-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py run:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: FLASK_DEBUG
        value: "0"
      - key: DATA_SOURCE
        value: auto
      - key: FALLBACK_TO_LOCAL
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: rota404
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build && node scripts/flatten-export-segments.mjs
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: STATIC_EXPORT
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        sync: false
    # o Render não completa a barra final: /aulas/<id> precisa apontar para /aulas/<id>/index.html
    # (regras só valem quando o arquivo pedido não existe; a última manda o resto para a página 404)
    routes:
      - type: rewrite
        source: /galaxias/*
        destination: /galaxias/*/index.html
      - type: rewrite
        source: /sistemas/*
        destination: /sistemas/*/index.html
      - type: rewrite
        source: /aulas/*
        destination: /aulas/*/index.html
      - type: rewrite
        source: /laboratorios/*
        destination: /laboratorios/*/index.html
      - type: rewrite
        source: /entrar
        destination: /entrar/index.html
      - type: rewrite
        source: /faixas-etarias
        destination: /faixas-etarias/index.html
      - type: rewrite
        source: /galaxias
        destination: /galaxias/index.html
      - type: rewrite
        source: /perfil
        destination: /perfil/index.html
      - type: rewrite
        source: /conquistas
        destination: /conquistas/index.html
      - type: rewrite
        source: /ranking
        destination: /ranking/index.html
      - type: rewrite
        source: /configuracoes
        destination: /configuracoes/index.html
      - type: rewrite
        source: /*
        destination: /404.html
